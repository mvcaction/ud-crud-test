version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: customercrm-postgres
    environment:
      POSTGRES_DB: CustomerCRM
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - customercrm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CustomerCRM"]
      interval: 10s
      timeout: 5s
      retries: 5

  customercrm-api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: customercrm-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=CustomerCRM;Username=postgres;Password=postgres123;Port=5432
    ports:
      - "5000:8080"
    volumes:
      - api_logs:/app/logs
    networks:
      - customercrm-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: customercrm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@customercrm.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - customercrm-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  api_logs:
    driver: local

networks:
  customercrm-network:
    driver: bridge